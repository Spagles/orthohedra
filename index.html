<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Cubes Editor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>

  <div id="overlay">
    <h1 id="title">Simple Cubes Editor</h1>
    <div class="modes">
      <button class="mode-btn active" data-mode="build" id="buildBtn">Build</button>
      <button class="mode-btn" data-mode="destroy" id="destroyBtn">Destroy</button>
    </div>
    <div class="render-modes" id="renderModes">
      <label><input type="radio" name="renderMode" value="normal" checked> Normal</label>
      <label><input type="radio" name="renderMode" value="no-red"> No red</label>
      <label><input type="radio" name="renderMode" value="no-yellow"> No yellow</label>
      <label><input type="radio" name="renderMode" value="no-blue"> No blue</label>
    </div>
    <p id="status">Mode: Build<br>Cubes: 1</p>
  </div>

  <div id="error"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
